name: Verify release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.6
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag ghorbox:ci .
      - name: Check installed migrations and offline recovery as non-root
        run: >-
          docker run --rm --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --network=none
          --tmpfs /tmp:rw,noexec,nosuid,size=128m,mode=1777
          --mount type=bind,source="$PWD/deploy/smoke.py",target=/smoke.py,readonly
          ghorbox:ci python /smoke.py
